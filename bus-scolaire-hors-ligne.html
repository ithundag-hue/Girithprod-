</style></head><body>
<header><h1>🚌 Gestion des bus scolaires</h1><small>Cartes, badges d’abonnement et paiements</small></header>
<div id="adm"></div><nav id="nav"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const TABS=[['dash','📊 Accueil'],['classes','🏫 Classes'],['eleves','🎒 Élèves'],['pers','👤 Personnel'],['lignes','🛣 Lignes'],['abo','🎫 Abonnements'],['paie','💵 Paiements'],['fam','👪 Familles'],['lit','⚖️ Litiges'],['abs','📅 Absences'],['cartes','🪪 Cartes'],['rap','📋 Rapports'],['scan','📷 Scanner'],['sync','🔄 Synchro'],['users','🔑 Utilisateurs']];
let S={eleves:[],pers:[],lignes:[{id:'L1',nom:'Ligne 1 – Centre',tarif:30},{id:'L2',nom:'Ligne 2 – Nord',tarif:30}],abo:[],paie:[],n:1,classes:[],lit:[],abs:[],pres:[],pin:'1234',pinF:'5678',users:[{id:'U1',nom:'Super admin',role:'admin',code:'1234'},{id:'U2',nom:'Finance',role:'finance',code:'5678'}]};
let tab='dash',photo='',sel='',viewId=null,ADMIN=false,FIN=false,stu=false;const APP_URL=location.href.split('#')[0];
try{const r=localStorage.getItem('bus_v1');if(r){S=Object.assign({classes:[],lit:[],abs:[],pres:[],pin:'1234',pinF:'5678'},JSON.parse(r));if(!S.users)S.users=[{id:'U1',nom:'Super admin',role:'admin',code:S.pin},{id:'U2',nom:'Finance',role:'finance',code:S.pinF}];S.lignes.forEach(l=>{if(l.id==='L1'&&l.tarif===25)l.tarif=30})}}catch(e){}
function save(){try{localStorage.setItem('bus_v1',JSON.stringify(S))}catch(e){}}
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLS0=['eleves','pers','lignes','abo','paie','lit','abs','users','pres'];
const uid=p=>{let i;do{i=p+(Math.floor(Date.now()/1000)-1700000000)+String(Math.floor(Math.random()*90)+10)}while(COLS0.some(k=>(S[k]||[]).some(x=>x.id===i)));return i};
const ligne=id=>S.lignes.find(l=>l.id===id)||{nom:'—',tarif:0};
const el=id=>S.eleves.find(e=>e.id===id);
const money=n=>(+n||0).toFixed(2)+' '+((S.school&&S.school.devise)||'$');
const today=()=>new Date().toISOString().slice(0,10);
function dueOf(a){return ligne(a.ligne).tarif*a.mois}
function paidOf(a){return S.paie.filter(p=>p.abo===a.id).reduce((s,p)=>s+ +p.montant,0)}
function endDate(a){const d=new Date(a.debut+'-01');d.setMonth(d.getMonth()+ +a.mois);d.setDate(0);return d.toISOString().slice(0,10)}
function status(a){const s=paidOf(a),d=dueOf(a);return s>=d?'Soldé':s>0?'Partiel':'Impayé'}
function qr(txt){txt=APP_URL+'#'+(txt.startsWith('BUS|')?txt.split('|')[2]:txt.split('|')[1]);try{const q=qrcode(0,'M');q.addData(txt);q.make();return q.createSvgTag({cellSize:3,margin:0})}catch(e){return ''}}
function initials(n){return esc((n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase())}
function phHTML(p,n){return p?`<img class="ph" src="${p}" alt="">`:`<div class="ph">${initials(n)}</div>`}
function nav(){const nb={dash:S.eleves.filter(e=>issues(e.id).length).length,lit:S.lit.filter(x=>x.etat==='Ouvert').length};$('#nav').innerHTML=TABS.map(t=>{const i=t[1].indexOf(' ');return `<button class="${t[0]===tab&&!viewId?'on':''}" onclick="go('${t[0]}')"><span class="ic">${t[1].slice(0,i)}</span><span>${t[1].slice(i+1)}</span>${nb[t[0]]?`<i class="bg">${nb[t[0]]}</i>`:''}</button>`}).join('');$('#adm').innerHTML=`<div class="adm">${netTag()}${ADMIN?'🔓 <b>Super admin</b> <button class="btn s" onclick="logout()">Se déconnecter</button> <button class="btn s" onclick="chPin()">Changer le code</button> <button class="btn s" onclick="chPinF()">Code Finance</button>':(FIN?'👤 <b>Finance</b> <button class="btn s" onclick="logout()">Se déconnecter</button> <button class="btn s" onclick="chPinF()">Changer le code</button>':'👤 Mode agent <button class="btn s" onclick="login()">🔒 Super admin</button> <button class="btn s" onclick="loginF()">🔒 Finance</button>')}</div>`}
function go(t){tab=t;viewId=null;photo='';render()}
function readPhoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=140;c.height=176;const x=c.getContext('2d');const k=Math.max(140/i.width,176/i.height);x.drawImage(i,(140-i.width*k)/2,(176-i.height*k)/2,i.width*k,i.height*k);photo=c.toDataURL('image/jpeg',.8);$('#pv').textContent='Photo prête ✓'};i.src=r.result};r.readAsDataURL(f)}
const lopts=(v)=>S.lignes.map(l=>`<option value="${l.id}" ${l.id===v?'selected':''}>${esc(l.nom)}</option>`).join('');
function table(h,rows){return rows.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`:'<div class="empty">Aucune donnée pour le moment.</div>'}
function del(k,id){if(!confirm('Supprimer cet élément ?'))return;S[k]=S[k].filter(x=>x.id!==id);if(k==='eleves'){const ids=S.abo.filter(a=>a.eleve===id).map(a=>a.id);S.abo=S.abo.filter(a=>a.eleve!==id);S.paie=S.paie.filter(p=>!ids.includes(p.abo))}if(k==='abo')S.paie=S.paie.filter(p=>p.abo!==id);save();render()}
function v(id){return $('#'+id).value.trim()}

function render(){nav();const m=$('#app');document.body.classList.toggle('stu',!!(stu&&viewId));if(tab==='paie'&&!viewId&&!(FIN||ADMIN)){m.innerHTML=lockCard('les paiements');return}if(viewId){m.innerHTML=fiche(viewId);return}if(R3[tab]){m.innerHTML=R3[tab]();if(tab==='scan')startScan();if(tab==='fam')famInit();if(tab==='pres')presInit();return}
if(tab==='dash'){const due=S.abo.reduce((s,a)=>s+dueOf(a),0),pd=S.abo.reduce((s,a)=>s+paidOf(a),0);
m.innerHTML=`<div class="st"><div><b>${S.eleves.length}</b><span>Élèves</span></div><div><b>${S.pers.length}</b><span>Personnel</span></div><div><b>${S.abo.length}</b><span>Abonnements</span></div><div><b class="ok">${money(pd)}</b><span>Encaissé</span></div><div><b class="ko">${money(due-pd)}</b><span>Reste à payer</span></div></div>
${alertCard()}${insights()}<div class="card"><h2>Abonnements par ligne</h2>${table(['Ligne','Tarif/mois','Abonnés','Encaissé'],S.lignes.map(l=>{const as=S.abo.filter(a=>a.ligne===l.id);return `<tr><td>${esc(l.nom)}</td><td>${money(l.tarif)}</td><td>${as.length}</td><td>${money(as.reduce((s,a)=>s+paidOf(a),0))}</td></tr>`}))}</div>
<div class="card"><h2>Démarrer</h2><div class="empty">1) Ajoutez vos lignes et tarifs · 2) Enregistrez les élèves et le personnel · 3) Créez les abonnements · 4) Encaissez les paiements · 5) Imprimez cartes et badges. Les données sont enregistrées sur cet appareil.</div></div>`}
if(tab==='eleves'){m.innerHTML=`<div class="card"><h2>Nouvel élève</h2><div class="grid"><div><label>Nom</label><input id="n"></div><div><label>Postnom</label><input id="pn"></div><div><label>Prénom</label><input id="pr"></div><div><label>Sexe</label><select id="sx"><option value="">— Choisir —</option><option value="M">Masculin</option><option value="F">Féminin</option></select></div><div><label>Classe</label><select id="c">${S.classes.map(c=>`<option>${esc(c)}</option>`).join('')||'<option value="">— aucune classe créée —</option>'}</select></div><div><label>Famille (frères et sœurs)</label><input id="fm" list="fml" placeholder="ex. Famille Kabila"><datalist id="fml">${famNames()}</datalist></div><div><label>Parent / tuteur</label><input id="t"></div><div><label>Téléphone</label><input id="tel"></div><div><label>Photo</label><input type="file" accept="image/*" onchange="readPhoto(this)"><small id="pv"></small></div></div><p><button class="btn" onclick="addEleve()">Ajouter</button></p></div>
<div class="card"><h2>Liste (${S.eleves.length})</h2><input placeholder="🔍 Rechercher un élève (nom, classe, matricule)…" oninput="ftab(this,'#app table tr')" style="margin-bottom:10px">${table(['Matricule','Nom','Classe','Tuteur','Tél.','Statut','Carte',''],S.eleves.map(e=>`<tr><td>${e.id}</td><td>${esc(e.nom)}</td><td>${esc(e.classe)}</td><td>${esc(e.tuteur)}</td><td>${esc(e.tel)}</td><td>${badge(e.id)}</td><td>${e.carte?'✔ '+e.carte:'—'}</td><td><button class="btn s" onclick="openF('${e.id}')">Fiche</button> <button class="btn s" onclick="editEl('${e.id}')">Modifier</button> <button class="btn" onclick="payEl('${e.id}')">💵 Payer</button> <button class="btn d" onclick="del('eleves','${e.id}')">✕</button></td></tr>`))}</div>`}
if(tab==='pers'){m.innerHTML=`<div class="card"><h2>Nouveau membre du personnel</h2><div class="grid"><div><label>Nom</label><input id="n"></div><div><label>Postnom</label><input id="pn"></div><div><label>Prénom</label><input id="pr"></div><div><label>Sexe</label><select id="sx"><option value="">— Choisir —</option><option value="M">Masculin</option><option value="F">Féminin</option></select></div><div><label>Fonction</label><select id="f"><option>Chauffeur</option><option>Accompagnateur</option><option>Enseignant</option><option>Administration</option><option>Autre</option></select></div><div><label>Téléphone</label><input id="tel"></div><div><label>Photo</label><input type="file" accept="image/*" onchange="readPhoto(this)"><small id="pv"></small></div></div><p><button class="btn" onclick="addPers()">Ajouter</button></p></div>
<div class="card"><h2>Liste (${S.pers.length})</h2><input placeholder="🔍 Rechercher un membre du personnel…" oninput="ftab(this,'#app table tr')" style="margin-bottom:10px">${table(['ID','Nom','Fonction','Tél.',''],S.pers.map(e=>`<tr><td>${e.id}</td><td>${esc(e.nom)}</td><td>${esc(e.poste)}</td><td>${esc(e.tel)}</td><td><button class="btn s" onclick="openF('${e.id}')">Fiche</button> <button class="btn s" onclick="editPers('${e.id}')">Modifier</button> <button class="btn d" onclick="del('pers','${e.id}')">✕</button></td></tr>`))}</div>`}
if(tab==='lignes'){m.innerHTML=`<div class="card"><h2>Nouvelle ligne de bus</h2><div class="grid"><div><label>Nom / trajet</label><input id="n"></div><div><label>Tarif mensuel ($)</label><input id="t" type="number" min="0" step="0.5" value="30"></div></div><p><button class="btn" onclick="addLigne()">Ajouter</button></p></div>
<div class="card"><h2>Lignes</h2>${table(['Ligne','Tarif/mois',''],S.lignes.map(l=>`<tr><td>${esc(l.nom)}</td><td>${money(l.tarif)}</td><td>${ADMIN?`<button class="btn s" onclick="editLigne('${l.id}')">Modifier</button> `:''}<button class="btn d" onclick="del('lignes','${l.id}')">✕</button></td></tr>`))}</div>`}
if(tab==='abo'){m.innerHTML=`<div class="card"><h2>Nouvel abonnement</h2><div class="grid"><div><label>Élève</label><input placeholder="🔍 Rechercher…" oninput="fsel(this,'e')" style="margin-bottom:4px"><select id="e">${S.eleves.map(e=>`<option value="${e.id}">${esc(e.nom)} (${e.id})</option>`).join('')}</select></div><div><label>Ligne</label><select id="l">${lopts()}</select></div><div><label>Mois de début</label><input id="d" type="month" value="${today().slice(0,7)}"></div><div><label>Durée (mois)</label><input id="m" type="number" min="1" max="12" value="1"></div></div><p><button class="btn" onclick="addAbo()">Créer</button></p></div>
<div class="card"><h2>Abonnements (${S.abo.length})</h2><input placeholder="🔍 Rechercher un abonnement ou un élève…" oninput="ftab(this,'#app table tr')" style="margin-bottom:10px">${table(['N°','Élève','Ligne','Validité','Dû','Payé','Statut',''],S.abo.map(a=>{const e=el(a.eleve),s=status(a);return `<tr><td>${a.id}</td><td>${esc(e?.nom)}</td><td>${esc(ligne(a.ligne).nom)}</td><td>${a.debut} → ${endDate(a)}</td><td>${money(dueOf(a))}</td><td>${money(paidOf(a))}</td><td class="${s==='Soldé'?'ok':'ko'}">${s}</td><td>${s==='Soldé'?'':`<button class="btn" onclick="payFor('${a.id}')">💵 Payer</button> `}<button class="btn s" onclick="editAbo('${a.id}')">Modifier</button> <button class="btn d" onclick="del('abo','${a.id}')">✕</button></td></tr>`}))}</div>`}
if(tab==='paie'){const open=S.abo.filter(a=>status(a)!=='Soldé');m.innerHTML=`<div class="card"><h2>Enregistrer un paiement</h2><div class="grid"><div><label>Abonnement</label><input placeholder="🔍 Rechercher un élève…" oninput="fsel(this,'a')" style="margin-bottom:4px"><select id="a" onchange="fillMois()">${S.abo.map(a=>`<option value="${a.id}">${esc(el(a.eleve)?.nom)} – reste ${money(dueOf(a)-paidOf(a))}</option>`).join('')}</select></div><div><label>Mois payé</label><select id="pm"></select></div><div><label>Montant ($)</label><input id="mt" readonly></div><div><label>Date</label><input id="dt" type="date" value="${today()}"></div><div><label>Mode</label><select id="md"><option>Espèces</option><option>Mobile Money</option><option>Banque</option></select></div></div><p><button class="btn" onclick="addPaie()">Encaisser</button> <small class="empty">${open.length} abonnement(s) non soldé(s)</small></p></div>
<div class="card"><h2>Historique</h2><input placeholder="🔍 Rechercher un paiement (nom, date, reçu)…" oninput="ftab(this,'#app table tr')" style="margin-bottom:10px">${table(['Reçu','Date','Élève','Mois payé','Montant','Mode',''],[...S.paie].reverse().map(p=>{const a=S.abo.find(x=>x.id===p.abo);return `<tr><td>${p.id}</td><td>${p.date}</td><td>${esc(el(a?.eleve)?.nom)}</td><td>${p.mois?mlab(p.mois):'—'}</td><td>${money(p.montant)}</td><td>${esc(p.mode)}</td><td><button class="btn s" onclick="editPaie('${p.id}')">Modifier</button> <button class="btn s" onclick="recu('${p.id}')">Reçu</button> <button class="btn d" onclick="del('paie','${p.id}')">✕</button></td></tr>`}))}</div>`}
if(tab==='cartes'){m.innerHTML=`<div class="card noprint"><h2>Générer</h2>${baseUrl()?`<div class="empty">Les QR ouvrent : <b>${esc(baseUrl())}</b></div>`:'<div class="empty ko">⚠ Aucune adresse web publique définie : les QR ne sont pas encore des liens. Renseignez-la dans Réglages.</div>'}<div class="grid"><div><label>Type</label><select id="ty" onchange="sel='';render2()"><option value="el">Cartes d’élèves</option><option value="pe">Cartes du personnel</option><option value="ba">Badges d’abonnement bus</option></select></div><div><label>École</label><input id="sc" value="${esc(schName())}" oninput="setSch('nom',this.value);render2()"></div><div><label>Design du mois</label><select id="mo" onchange="render2()">${MOIS.map((m,i)=>`<option value="${i}" ${i===new Date().getMonth()?'selected':''}>${m[0]}</option>`).join('')}</select></div><div><label>Rechercher</label><input id="qc" placeholder="🔍 Nom, classe, matricule…" oninput="ftab(this,'#cc .cw')"></div><div><label>Orientation</label><select id="or" onchange="render2()"><option value="l">Paysage</option><option value="p">Portrait</option></select></div><div><label>Modèle de carte</label><select id="dg" onchange="render2()"><option value="a">Clair professionnel</option><option value="b">Moderne</option><option value="c">Minimal</option><option value="d">Premium noir & or</option></select></div><div><label>Motif</label><select id="st" onchange="render2()"><option value="c">Cercles</option><option value="v">Vagues</option><option value="r">Rayures</option></select></div><div><label>Logo de l’établissement</label><input type="file" accept="image/*" onchange="readLogo(this)"></div><div><label>Année scolaire</label><input id="an" value="${esc(SCH().annee||'2026-2027')}" oninput="render2()"></div></div><p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="prt()">🖨 Imprimer</button><button class="btn s" onclick="prtPdf()">⬇ Télécharger en PDF</button></p></div><div class="card noprint"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn" onclick="selAll('ok')">✔ Cocher uniquement les élèves en règle</button><button class="btn s" onclick="selAll('all')">Tout cocher</button><button class="btn s" onclick="selAll('none')">Tout décocher</button><b id="cnt"></b></div></div><div class="card"><div class="cards" id="cc"></div></div>`;render2()}if(tab==='paie')fillMois()}
function readLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,160/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);S.logo=c.toDataURL('image/png');save();render2()};i.src=r.result};r.readAsDataURL(f)}
function num(p,id){const d=id.slice(1).padStart(8,'0');return p+' '+d.slice(0,4)+' '+d.slice(4)}
function render2(){const ty=$('#ty').value,sc=esc($('#sc').value),an=esc($('#an').value),lg=`<div class="lg">${S.logo?`<img src="${S.logo}" alt="">`:'LOGO'}</div>`;let h='';
if(ty==='el')h=S.eleves.map(e=>w('el:'+e.id,okEl(e.id),`<div class="idc">${lg}<div class="sn">${sc}<small>CARTE D’ÉLÈVE · ${an}</small></div>${phHTML(e.photo,e.nom)}<div class="num">${num('ELV',e.id)}</div><div class="nm"><b>${esc(e.nom)}</b>Classe ${esc(e.classe)} · ${esc(e.tel)}<br>${vEl(e.id)}</div><div class="qr">${qr('ELEVE|'+e.id)}</div></div>`)).join('');
if(ty==='pe')h=S.pers.map(e=>w('pe:'+e.id,true,`<div class="idc staff">${lg}<div class="sn">${sc}<small>CARTE DU PERSONNEL · ${an}</small></div>${phHTML(e.photo,e.nom)}<div class="num">${num('PRS',e.id)}</div><div class="nm"><b>${esc(e.nom)}</b>${esc(e.poste)} · ${esc(e.tel)}<br>Valide : ${an}</div><div class="qr">${qr('STAFF|'+e.id)}</div></div>`)).join('');
if(ty==='ba')h=S.abo.map(a=>{const e=el(a.eleve);if(!e)return'';return w('ba:'+a.id,status(a)==='Soldé',`<div class="idc badge">${lg}<div class="sn">${sc}<small>BADGE BUS · ${status(a).toUpperCase()}</small></div>${phHTML(e.photo,e.nom)}<div class="num">${num('BUS',a.id)}</div><div class="nm"><b>${esc(e.nom)}</b>${esc(ligne(a.ligne).nom)} · ${vTxt(a)}</div><div class="qr">${qr('BUS|'+a.id+'|'+e.id+'|'+endDate(a))}</div></div>`)}).join('');
const cc=$('#cc'),t=MOIS[+$('#mo').value];cc.style.setProperty('--c1',t[1]);cc.style.setProperty('--c2',t[2]);cc.style.setProperty('--c3',t[3]);cc.dataset.s=$('#st').value;cc.dataset.d=$('#dg').value;
cc.innerHTML=h||'<div class="empty">Aucune carte à générer : ajoutez d’abord des données.</div>';{const q=$('#qc');if(q)ftab(q,'#cc .cw');cnt()}}

async function tarOk(){const c=chkCode(V('fcode'));if(c)return fdErr(c);for(let i=0;i<S.classes.length;i++){const cl=S.classes[i],a=Math.max(0,rnd(V('tI'+i)||0)),b=Math.max(0,rnd(V('tM'+i)||0)),id='T'+nk(cl).replace(/\W/g,''),x=S.tarifs.find(t=>t.id===id);if(x){if(x.insc!==a||x.mens!==b)await jr('TARIF',cl+' · '+x.insc+'/'+x.mens+' → '+a+'/'+b);x.insc=a;x.mens=b}else{S.tarifs.push({id,classe:cl,insc:a,mens:b});await jr('TARIF',cl+' · '+a+'/'+b)}}save();fdClose();render();toast('Tarifs enregistrés.')}
/* ----- Annulation (Super admin) + intégrité ----- */
function openAnnul(id){if(!ADMIN)return;const p=S.fpay.find(x=>x.id===id);if(!p||p.annule)return;fdOpen(`<h2>Annuler ${esc(p.rc)}</h2><p>${money(p.montant)} · ${esc(mnm(p.mois))}</p><div class="grid"><div><label>Motif (obligatoire)</label><input id="fmo"></div>${codeFld()}</div><p style="display:flex;gap:8px;margin-top:10px"><button class="btn d" onclick="annulOk('${esc(id)}')">Annuler le paiement</button><button class="btn s" onclick="fdClose()">Retour</button></p>`)}
async function annulOk(id){const p=S.fpay.find(x=>x.id===id),m=V('fmo').trim();if(m.length<3)return fdErr('Indiquez un motif.');const c=chkCode(V('fcode'));if(c)return fdErr(c);p.annule={par:CUR.nom,t:Date.now(),motif:m};await jr('ANNULATION',p.rc+' · '+m);save();fdClose();render();toast('Paiement annulé (conservé dans l’historique).')}
async function verifAll(){const bad=[];for(const p of S.fpay)if(p.h!==await pHash(p))bad.push('Reçu '+p.rc+' modifié');for(const j of S.jrn)if(j.h!==await sha([j.prev,j.t,j.u,j.act,j.det].join('|')))bad.push('Journal '+new Date(j.t).toLocaleString('fr-FR')+' modifié');S.fpay.forEach(p=>{if(!el(p.eleve))bad.push('Reçu '+p.rc+' : élève introuvable')});
 fdOpen(`<h2>🛡 Vérification d’intégrité</h2><p class="${bad.length?'ko':'ok'}">${bad.length?'⚠ '+bad.length+' anomalie(s) détectée(s)':'✔ '+S.fpay.length+' reçu(s) et '+S.jrn.length+' entrée(s) de journal authentiques'}</p>${bad.slice(0,15).map(b=>`<p>• ${esc(b)}</p>`).join('')}<p><button class="btn s" onclick="fdClose()">Fermer</button></p>`)}
/* ----- Pages ----- */
function fTable(){const q=nk(V('fq')),cl=V('fc'),M=MOISF(),now=ym(),L=S.eleves.filter(e=>(!q||nk(e.nom).includes(q))&&(!cl||e.classe===cl)).slice(0,300);
 return `<div class="tw"><table><tr><th>Élève</th>${M.map(m=>`<th title="${esc(mnm(m))}">${MN[+m.slice(5)].slice(0,3)}</th>`).join('')}<th>Solde dû</th></tr>${L.map(e=>{const t=tar(e.classe),ins=S.insc.some(i=>i.eleve===e.id&&i.annee===ANN());let arr=0;const cells=M.map(m=>{const p=fPaid(e.id,m),st=t.mens>0&&p>=t.mens?'ok':p>0?'part':m>now?'fut':'no';if(m<=now)arr+=Math.max(0,t.mens-p);return `<td><button class="fc ${st}" ${FIN&&st!=='ok'?`onclick="openPay('${esc(e.id)}','${m}')"`:'disabled'} title="${esc(mnm(m))} : ${money(p)}">${st==='ok'?'✔':st==='part'?'◐':st==='fut'?'·':'○'}</button></td>`}).join('');return `<tr><td><b>${esc(e.nom)}</b><br><small>${esc(e.classe)} ${ins?'':`· <a href="#" onclick="openInsc('${esc(e.id)}');return false">⚠ non inscrit</a>`}</small></td>${cells}<td><b class="${arr>0?'ko':'ok'}">${money(arr)}</b></td></tr>`}).join('')||'<tr><td colspan="12">Aucun élève.</td></tr>'}</table></div>`}
function refT(){const t=$('#ft');if(t)t.innerHTML=fTable()}
R3.frais=function(){const A=ANN(),P=S.fpay.filter(p=>p.annee===A&&!p.annule),tot=P.reduce((s,p)=>s+p.montant,0),mo=P.filter(p=>p.date.startsWith(ym())).reduce((s,p)=>s+p.montant,0);let arr=0,ret=0;const M=MOISF().filter(m=>m<=ym());S.eleves.forEach(e=>{const t=tar(e.classe);let a=0;M.forEach(m=>{a+=Math.max(0,t.mens-fPaid(e.id,m))});arr+=a;if(a>0)ret++});
 return `<div class="card"><h2>Frais scolaires · ${esc(A)}</h2><div class="st"><div><b>${money(mo)}</b><span>Encaissé ce mois</span></div><div><b>${money(tot)}</b><span>Total encaissé</span></div><div><b>${money(arr)}</b><span>Arriérés</span></div><div><b>${ret}</b><span>Élèves en retard</span></div></div></div>
 <div class="card"><div class="grid"><div><label>Recherche</label><input id="fq" placeholder="Nom de l’élève" oninput="refT()"></div><div><label>Classe</label><select id="fc" onchange="refT()"><option value="">Toutes</option>${S.classes.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div></div><div id="ft" style="margin-top:10px">${fTable()}</div><p class="empty">✔ payé · ◐ partiel · ○ impayé · · à venir. Touchez un mois pour encaisser.</p></div>
 <div class="card"><h2>Derniers paiements</h2><div class="tw"><table><tr><th>Reçu</th><th>Élève</th><th>Motif</th><th>Montant</th><th></th></tr>${S.fpay.slice(-40).reverse().map(p=>`<tr><td>${esc(p.rc)}${p.annule?'<br><small class="ko">ANNULÉ · '+esc(p.annule.motif)+'</small>':''}</td><td>${esc((el(p.eleve)||{}).nom||'?')}</td><td>${esc(mnm(p.mois))}</td><td>${money(p.montant)}</td><td style="white-space:nowrap"><button class="btn s mini" onclick="recuF('${esc(p.id)}')">🖨</button>${ADMIN&&!p.annule?` <button class="btn d mini" onclick="openAnnul('${esc(p.id)}')">✕</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5">Aucun paiement.</td></tr>'}</table></div></div>
 ${ADMIN?`<div class="card"><h2>🛡 Sécurité</h2><div class="empty">Chaque paiement exige votre code d’accès, reçoit un numéro unique et une empreinte numérique. Rien n’est supprimé : une annulation est tracée avec son motif. Le journal enregistre qui a fait quoi et quand.</div><p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="verifAll()">🔍 Vérifier l’intégrité</button><button class="btn s" onclick="openTarifs()">⚙️ Tarifs</button></p><div class="tw"><table><tr><th>Date</th><th>Utilisateur</th><th>Action</th><th>Détail</th></tr>${S.jrn.slice(-15).reverse().map(j=>`<tr><td>${new Date(j.t).toLocaleString('fr-FR')}</td><td>${esc(j.u)}</td><td>${esc(j.act)}</td><td>${esc(j.det)}</td></tr>`).join('')||'<tr><td colspan="4">Journal vide.</td></tr>'}</table></div></div>`:''}`};
R3.insc=function(){const A=ANN(),I=S.insc.filter(i=>i.annee===A),ids=new Set(I.map(i=>i.eleve)),non=S.eleves.filter(e=>!ids.has(e.id)),ins=S.fpay.filter(p=>p.annee===A&&p.mois==='INSC'&&!p.annule).reduce((s,p)=>s+p.montant,0);
 return `<div class="card"><h2>Inscriptions · ${esc(A)}</h2><div class="st"><div><b>${I.length}</b><span>Inscrits</span></div><div><b>${non.length}</b><span>Non inscrits</span></div><div><b>${money(ins)}</b><span>Frais encaissés</span></div></div><p style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" onclick="openInsc()">➕ Nouvelle inscription</button>${ADMIN?'<button class="btn s" onclick="openTarifs()">⚙️ Tarifs par classe</button>':''}</p></div>
 <div class="card"><h2>Élèves inscrits</h2><div class="tw"><table><tr><th>Date</th><th>Élève</th><th>Classe</th><th>Inscription</th><th>Par</th></tr>${I.slice().reverse().map(i=>{const e=el(i.eleve)||{nom:'?'},d=tar(i.classe).insc,p=fPaid(i.eleve,'INSC');return `<tr><td>${esc(i.date)}</td><td><b>${esc(e.nom)}</b></td><td>${esc(i.classe)}</td><td>${d>0?(p>=d?'<span class="ok">✔ Payé</span>':money(p)+' / '+money(d)+(FIN?` <button class="btn s mini" onclick="openPay('${esc(i.eleve)}','INSC')">Payer</button>`:'')):'—'}</td><td>${esc(i.par)}</td></tr>`}).join('')||'<tr><td colspan="5">Aucune inscription pour cette année.</td></tr>'}</table></div></div>
 ${non.length?`<div class="card"><h2>Non inscrits (${non.length})</h2><div class="tw"><table>${non.slice(0,30).map(e=>`<tr><td>${esc(e.nom)}<br><small>${esc(e.classe)}</small></td><td><button class="btn s mini" onclick="openInsc('${esc(e.id)}')">Inscrire</button></td></tr>`).join('')}</table></div></div>`:''}`};
TABS.push(['insc','📝 Inscriptions'],['frais','💳 Frais scolaires']);NAVG[1][1].push('insc');NAVG[2][1].push('frais');

/* ==========================================================================
   LISTES & EFFECTIFS : en ordre / pas en ordre, par classe, option, catégorie, sexe, section,
   date d'inscription, nom — impression et téléchargement (CSV)
   ========================================================================== */
const arrFrais=e=>{const t=tar(e.classe);return MOISF().filter(m=>m<=ym()).reduce((s,m)=>s+Math.max(0,t.mens-fPaid(e.id,m)),0)},
 uniq=k=>[...new Set(S.eleves.map(e=>(e[k]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr')),
 selF=(id,lab,arr)=>`<div><label>${lab}</label><select id="${id}" onchange="lstRef()"><option value="">Tous</option>${arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>`;
const DIMS={classe:['Classe',r=>r.e.classe],opt:['Option',r=>r.e.opt||'—'],cat:['Catégorie',r=>r.e.cat||'—'],sx:['Sexe',r=>r.e.sx==='F'?'Filles':r.e.sx==='M'?'Garçons':'—'],sec:['Section',r=>r.e.sec||'—'],date:['Date d’inscription',r=>r.date||'Non inscrit'],nom:['Initiale du nom',r=>(r.e.nom||'?')[0].toUpperCase()]};
function lstData(){const q=nk(V('lq')),cl=V('lcl'),op=V('lop'),ca=V('lca'),sx=V('lsx'),se=V('lse'),st=V('lst'),cr=V('lcr')||'bus',d1=V('ld1'),d2=V('ld2'),tri=V('ltr')||'nom',ins={};
 S.insc.filter(i=>i.annee===ANN()).forEach(i=>{ins[i.eleve]=i.date});
 const L=S.eleves.map(e=>{const b=okEl(e.id),f=arrFrais(e)===0;return {e,ok:cr==='bus'?b:cr==='frais'?f:b&&f,date:ins[e.id]||''}}).filter(r=>(!q||nk(r.e.nom).includes(q))&&(!cl||r.e.classe===cl)&&(!op||(r.e.opt||'')===op)&&(!ca||(r.e.cat||'')===ca)&&(!sx||r.e.sx===sx)&&(!se||(r.e.sec||'')===se)&&(!st||(st==='ok')===r.ok)&&(!d1||(r.date&&r.date>=d1))&&(!d2||(r.date&&r.date<=d2))),
 n=(a,b)=>a.e.nom.localeCompare(b.e.nom,'fr'),C={nom:n,classe:(a,b)=>a.e.classe.localeCompare(b.e.classe,'fr')||n(a,b),date:(a,b)=>(a.date||'9').localeCompare(b.date||'9')||n(a,b),sexe:(a,b)=>(a.e.sx||'').localeCompare(b.e.sx||'')||n(a,b)};return L.sort(C[tri]||n)}
function lstTitle(){const p=[];[['lcl','Classe'],['lop','Option'],['lca','Catégorie'],['lse','Section']].forEach(([i,l])=>{if(V(i))p.push(l+' '+V(i))});if(V('lsx'))p.push(V('lsx')==='M'?'Garçons':'Filles');if(V('ld1')||V('ld2'))p.push('Inscrits '+(V('ld1')?'du '+V('ld1'):'')+(V('ld2')?' au '+V('ld2'):''));const s=V('lst'),c={bus:'transport',frais:'frais scolaires',both:'transport + frais'}[V('lcr')||'bus'];return 'Liste des élèves'+(s?' '+(s==='ok'?'EN ORDRE':'PAS EN ORDRE')+' ('+c+')':'')+(p.length?' — '+p.join(' · '):'')}
const lstRows=L=>[['N°','Matricule','Nom','Sexe','Classe','Section','Option','Catégorie','Date d’inscription','Statut'],...L.map((r,i)=>[i+1,r.e.id,r.e.nom,r.e.sx||'',r.e.classe,r.e.sec||'',r.e.opt||'',r.e.cat||'',r.date,r.ok?'En ordre':'Pas en ordre'])];
function effData(L){const d=DIMS[V('lgr')||'classe'],g={};L.forEach(r=>{const k=d[1](r),x=g[k]=g[k]||{k,t:0,m:0,f:0,ok:0,ko:0};x.t++;if(r.e.sx==='M')x.m++;if(r.e.sx==='F')x.f++;r.ok?x.ok++:x.ko++});const A=Object.values(g).sort((a,b)=>a.k.localeCompare(b.k,'fr',{numeric:true}));return {h:[d[0],'Effectif','Garçons','Filles','En ordre','Pas en ordre'],rows:A.map(x=>[x.k,x.t,x.m,x.f,x.ok,x.ko]),tot:['TOTAL',...[1,2,3,4,5].map(i=>A.reduce((s,x)=>s+[0,x.t,x.m,x.f,x.ok,x.ko][i],0))]}}
function lstPrint(kind){const L=lstData();if(!L.length)return alert('Aucun élève à imprimer.');let t,h,rows;if(kind==='eff'){const E=effData(L);t='Effectif par '+E.h[0].toLowerCase();h=E.h;rows=[...E.rows,E.tot]}else{const R=lstRows(L);t=lstTitle();h=R[0];rows=R.slice(1)}
 printHTML(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(t)}</title><style>@page{margin:12mm}body{font:12px system-ui,sans-serif;color:#111}header{display:flex;align-items:center;gap:12px;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:10px}img{height:52px}h1{font-size:17px;margin:0}h2{font-size:14px;margin:2px 0 0;font-weight:600}table{width:100%;border-collapse:collapse}th{background:#e5e7eb;text-align:left}th,td{border:1px solid #888;padding:4px 6px}thead{display:table-header-group}tr{page-break-inside:avoid}tr:last-child td{${kind==='eff'?'font-weight:800;background:#f3f4f6':''}}footer{margin-top:10px;color:#555;font-size:11px}</style></head><body><header>${S.logo?'<img src="'+S.logo+'">':''}<div><h1>${esc(schName())}</h1><h2>${esc(t)} · ${esc(ANN())}</h2></div></header><table><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table><footer>${kind==='eff'?'':L.length+' élève(s) · '}Édité le ${esc(new Date().toLocaleString('fr-FR'))} par ${esc(CUR?CUR.nom:'')}</footer></body></html>`)}
function lstCsv(kind){const L=lstData();if(!L.length)return alert('Aucun élève à exporter.');if(kind==='eff'){const E=effData(L);csvDown('effectif-'+(V('lgr')||'classe')+'-'+today()+'.csv',[E.h,...E.rows,E.tot])}else csvDown('liste-eleves-'+today()+'.csv',lstRows(L));toast('Fichier téléchargé.')}
function lstRef(){const L=lstData(),E=effData(L),ok=L.filter(r=>r.ok).length,box=$('#lres');if(!box)return;
 box.innerHTML=`<div class="card"><h2>${esc(lstTitle())}</h2><div class="st"><div><b>${L.length}</b><span>Élèves</span></div><div><b class="ok">${ok}</b><span>En ordre</span></div><div><b class="ko">${L.length-ok}</b><span>Pas en ordre</span></div></div><p style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button class="btn" onclick="lstPrint('liste')">🖨 Imprimer / PDF</button><button class="btn s" onclick="lstCsv('liste')">⬇ Télécharger (Excel/CSV)</button></p><div class="tw"><table><tr><th>N°</th><th>Nom</th><th>Sexe</th><th>Classe</th><th>Section</th><th>Option</th><th>Catégorie</th><th>Inscrit le</th><th>Statut</th>${allow('gest')?'<th></th>':''}</tr>${L.slice(0,300).map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.e.nom)}</b></td><td>${esc(r.e.sx||'')}</td><td>${esc(r.e.classe)}</td><td>${esc(r.e.sec||'')}</td><td>${esc(r.e.opt||'')}</td><td>${esc(r.e.cat||'')}</td><td>${esc(r.date)}</td><td><span class="${r.ok?'ok':'ko'}">${r.ok?'✔ En ordre':'✖ Pas en ordre'}</span></td>${allow('gest')?`<td><button class="btn s mini" onclick="openAttr('${esc(r.e.id)}')">✏️</button></td>`:''}</tr>`).join('')||'<tr><td colspan="10">Aucun résultat.</td></tr>'}</table></div>${L.length>300?'<p class="empty">Affichage limité à 300 lignes ; l’impression et le téléchargement contiennent tout.</p>':''}</div>
 <div class="card"><h2>Effectif par ${esc(E.h[0].toLowerCase())}</h2><p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="lstPrint('eff')">🖨 Imprimer / PDF</button><button class="btn s" onclick="lstCsv('eff')">⬇ Télécharger (Excel/CSV)</button></p><div class="tw"><table><tr>${E.h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${E.rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i?c:'<b>'+esc(c)+'</b>'}</td>`).join('')}</tr>`).join('')}<tr>${E.tot.map(c=>`<td><b>${c}</b></td>`).join('')}</tr></table></div></div>`}
R3.listes=function(){setTimeout(lstRef,0);const ST=[['bus','Transport (bus)'],['frais','Frais scolaires'],['both','Transport + frais']];
 return `<div class="card"><h2>Listes & effectifs · ${esc(ANN())}</h2><div class="grid"><div><label>Recherche par nom</label><input id="lq" oninput="lstRef()" placeholder="Nom…"></div>${selF('lcl','Classe',S.classes)}${selF('lse','Section',uniq('sec'))}${selF('lop','Option',uniq('opt'))}${selF('lca','Catégorie',uniq('cat'))}<div><label>Sexe</label><select id="lsx" onchange="lstRef()"><option value="">Tous</option><option value="M">Garçons</option><option value="F">Filles</option></select></div><div><label>Situation</label><select id="lst" onchange="lstRef()"><option value="">Tous</option><option value="ok">En ordre</option><option value="ko">Pas en ordre</option></select></div><div><label>« En ordre » selon</label><select id="lcr" onchange="lstRef()">${ST.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div><div><label>Inscrits du</label><input id="ld1" type="date" onchange="lstRef()"></div><div><label>au</label><input id="ld2" type="date" onchange="lstRef()"></div><div><label>Trier par</label><select id="ltr" onchange="lstRef()"><option value="nom">Nom</option><option value="classe">Classe</option><option value="date">Date d’inscription</option><option value="sexe">Sexe</option></select></div><div><label>Effectif par</label><select id="lgr" onchange="lstRef()">${Object.entries(DIMS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></div></div>${allow('gest')?'<p><button class="btn s" onclick="openAttrCl()">🏷 Définir section / option / catégorie d’une classe</button></p>':''}</div><div id="lres"></div>`};

const LBGP=[['Océan','linear-gradient(135deg,#0b1b3f,#1e3a8a 55%,#312e81)'],['Aurore','linear-gradient(135deg,#0f766e,#2563eb 55%,#7c3aed)'],['Soleil couchant','linear-gradient(135deg,#7c2d12,#ea580c 50%,#f59e0b)'],['Forêt','linear-gradient(135deg,#052e16,#15803d 60%,#65a30d)'],['Rubis','linear-gradient(135deg,#4c0519,#be123c 60%,#fb7185)'],['Nuit','linear-gradient(135deg,#020617,#1e293b 60%,#334155)'],['Lavande','linear-gradient(135deg,#312e81,#7c3aed 55%,#ec4899)'],['Clair','linear-gradient(135deg,#e0f2fe,#ddd6fe 60%,#fce7f3)']],
 LBGD={mode:'preset',preset:0,c1:'#1e3a8a',c2:'#7c3aed',angle:135,img:'',dark:25,blur:0,anim:true};
const lbg=()=>Object.assign({},LBGD,S.loginBg||{}),
 lum=h=>{h=String(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16)||0;return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255};
function lbgCss(b){b=b||lbg();return b.mode==='image'&&b.img?`url(${b.img}) center/cover no-repeat`:b.mode==='custom'?`linear-gradient(${b.angle}deg,${b.c1},${b.c2})`:LBGP[b.preset]?LBGP[b.preset][1]:LBGP[0][1]}
const lbgLight=b=>b.mode==='preset'?b.preset===7&&b.dark<30:b.mode==='custom'?(lum(b.c1)+lum(b.c2))/2>.68&&b.dark<30:false;
function lockHTML2(){const b=lbg(),w=String(schName()||'').split(/\s+/).filter(x=>x.replace(/\W/g,'').length>2).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'E';
 return `<div class="lgbg" style="background:${lbgCss(b)};filter:blur(${+b.blur}px);transform:scale(${1+b.blur/100})"></div><div class="lgov" style="opacity:${b.dark/100}"></div>${b.anim?'<div class="lgshp"><i></i><i></i><i></i></div>':''}
 <div class="lgw ${lbgLight(b)?'lgl-light':''}"><div class="lgh"><div class="lgl">${S.logo?`<img src="${S.logo}" alt="">`:`<div class="bl">${esc(w)}</div>`}</div><h1>${esc(schName())}</h1><p class="lgs">Gestion scolaire · transport et frais</p><div class="lgf"><span>${ico('idcard')} Cartes QR</span><span>${ico('card')} Paiements sécurisés</span><span>${ico('chart')} Suivi en direct</span></div><p id="lgclk" class="lgc"></p></div>
 <div class="lgbox"><h2>Connexion</h2><p>Entrez votre code d’accès pour ouvrir votre session.</p><label>Code d’accès</label><div class="lgp"><span class="lgk">${ico('lock')}</span><input id="lgc" type="password" autocomplete="current-password" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()"><button type="button" class="lge" onclick="const i=$('#lgc');i.type=i.type==='password'?'text':'password'" aria-label="Afficher le code">${ico('search')}</button></div><div id="lge" class="ko"></div><button class="btn" style="justify-content:center;width:100%" onclick="doLogin()">${ico('right')} Se connecter</button><p class="lgn">Accès réservé au personnel autorisé. Les parents peuvent scanner la carte de leur enfant sans connexion.</p></div></div>`}

function lbgSet(p,live){S.loginBg=Object.assign(lbg(),p);save();lbgPrev();if(!live)lbgCardRefresh()}
function lbgPrev(){const b=lbg(),e=document.getElementById('lbgp');if(e){e.style.background=lbgCss(b);e.firstElementChild.style.opacity=b.dark/100;e.style.filter=''}}
function lbgCardRefresh(){const c=document.getElementById('lbgc');if(c)c.outerHTML=lbgCard()}
function lbgImg(inp){const f=inp.files&&inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,1600/Math.max(im.width,im.height));c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);lbgSet({mode:'image',img:c.toDataURL('image/jpeg',.78)});URL.revokeObjectURL(im.src)};im.onerror=()=>alert('Image illisible.');im.src=URL.createObjectURL(f);inp.value=''}
function lbgCard(){if(!ADMIN)return '';const b=lbg(),md=(k,l)=>`<button class="btn ${b.mode===k?'':'s'}" onclick="lbgSet({mode:'${k}'})">${l}</button>`;
 return `<div class="card" id="lbgc"><h2>Arrière-plan de la connexion</h2><div id="lbgp" class="lbgp" style="background:${lbgCss(b)}"><div style="position:absolute;inset:0;background:#000;opacity:${b.dark/100}"></div><span>Aperçu</span></div><p style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">${md('preset','Dégradés')}${md('custom','Deux couleurs')}${md('image','Image')}</p>
 ${b.mode==='preset'?`<div class="swr">${LBGP.map((p,i)=>`<button class="swt ${b.preset===i?'sel':''}" title="${p[0]}" style="background:${p[1]}" onclick="lbgSet({preset:${i}})"></button>`).join('')}</div>`:''}
 ${b.mode==='custom'?`<div class="grid"><div><label>Couleur 1</label><input type="color" value="${b.c1}" style="height:42px;padding:3px" oninput="lbgSet({c1:this.value},1)" onchange="lbgSet({c1:this.value})"></div><div><label>Couleur 2</label><input type="color" value="${b.c2}" style="height:42px;padding:3px" oninput="lbgSet({c2:this.value},1)" onchange="lbgSet({c2:this.value})"></div><div><label>Angle (${b.angle}°)</label><input type="range" min="0" max="360" value="${b.angle}" oninput="lbgSet({angle:+this.value},1)" onchange="lbgSet({angle:+this.value})"></div></div>`:''}
 ${b.mode==='image'?`<p><label class="btn" style="cursor:pointer">${ico('upload')} Choisir une image<input type="file" accept="image/*" hidden onchange="lbgImg(this)"></label>${b.img?` <button class="btn s" onclick="lbgSet({img:'',mode:'preset'})">${ico('x')} Retirer</button>`:''}</p>${b.img?'':'<div class="empty">Aucune image : choisissez une photo de l’école (elle est réduite automatiquement).</div>'}`:''}
 <div class="grid" style="margin-top:8px"><div><label>Assombrir (${b.dark}%)</label><input type="range" min="0" max="80" value="${b.dark}" oninput="lbgSet({dark:+this.value},1)" onchange="lbgSet({dark:+this.value})"></div><div><label>Flou (${b.blur}px)</label><input type="range" min="0" max="20" value="${b.blur}" onchange="lbgSet({blur:+this.value})"></div></div>
 <label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;color:var(--tx)"><input type="checkbox" ${b.anim?'checked':''} style="width:auto" onchange="lbgSet({anim:this.checked})"> Formes lumineuses animées</label>
 <p><button class="btn s" onclick="S.loginBg=null;save();lbgCardRefresh()">${ico('ccw')} Réinitialiser</button></p></div>`}
{const f=R3.reglages;R3.reglages=function(){return f()+lbgCard()}}

/* ==========================================================================
   ENVOI RÉEL DES NOTIFICATIONS : email automatique (EmailJS), passerelle, envoi rapide
   ========================================================================== */
NCD.emailjs={service:'',template:'',key:''};NCD.autoMail=false;
async function sendEmailJS(e,msg,type){const c=NC(),j=c.emailjs||{};if(!j.service||!j.template||!j.key)throw new Error('EmailJS non configuré');if(!e.mail)throw new Error('Email du parent manquant');const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:j.service,template_id:j.template,user_id:j.key,template_params:{to_email:e.mail,to_name:e.tuteur||'Parent',subject:schName()+' — '+NT[type],message:msg,ecole:schName(),eleve:e.nom,reply_to:c.mail||''}})});if(!r.ok)throw new Error('EmailJS : '+(await r.text()).slice(0,120))}
async function autoDeliver(n){const c=NC(),e=el(n.eleve);if(!e)return false;const done=[],j=c.emailjs||{};
 if(c.canaux.email&&c.autoMail&&e.mail&&j.service){try{await sendEmailJS(e,n.msg,n.type);done.push('email')}catch(x){n.err=String(x.message||x)}}
 if(c.hook&&c.auto&&c.canaux.wapush&&(e.tel||e.mail)){try{await postHook(e,n.msg,n.type);done.push('automatique')}catch(x){n.err=String(x.message||x)}}
 if(done.length){n.etat='envoyé · '+done.join(' + ');delete n.err}save();bellUpd();return done.length>0}
autoNotify=function(eid,type,vars){try{const c=NC(),e=el(eid);if(!e||!c.events[type])return;const msg=composeMsg(type,e,vars),n=nLog(eid,type,msg,'attente');if(c.canaux.app)sysNotif(NT[type]+' · '+e.nom,msg);save();bellUpd();autoDeliver(n)}catch(x){}};
async function sendPendingAuto(){let k=0;for(const n of S.notifs.filter(x=>x.etat==='attente'))if(await autoDeliver(n))k++;toast(k?k+' notification(s) envoyée(s) automatiquement.':'Rien à envoyer automatiquement : activez l’email automatique ou la passerelle.');notifCenter()}
/* envoi rapide : une notification après l'autre, un appui par parent */
let FQ=[],FQI=0;
function fastSend(){FQ=S.notifs.filter(n=>n.etat==='attente'&&el(n.eleve)).map(n=>n.id);FQI=0;if(!FQ.length)return toast('Aucune notification en attente.');fqShow()}
function fqShow(){const n=S.notifs.find(x=>x.id===FQ[FQI]);if(!n){fdClose();bellUpd();toast('Envoi terminé.');return}const e=el(n.eleve),c=NC(),t=pnum(e.tel),B=(k,ic,l,ok)=>c.canaux[k]&&ok?`<button class="btn" onclick="fqSend('${k}')">${ico(ic)} ${l}</button>`:'';
 fdOpen(`<h2>${ico('refresh')} Envoi rapide ${FQI+1}/${FQ.length}</h2><p><b>${esc(e.nom)}</b> · ${esc(e.tuteur||'Parent')}<br><small>${esc(NT[n.type])} · ${esc(e.tel||'pas de téléphone')} · ${esc(e.mail||'pas d’email')}</small></p><p class="empty">${esc(n.msg)}</p><p style="display:flex;gap:8px;flex-wrap:wrap">${B('wa','msg','WhatsApp',t)}${B('sms','phone','SMS',t)}${B('email','mail','Email',e.mail)}<button class="btn s" onclick="fqNext()">Passer</button><button class="btn s" onclick="fdClose();bellUpd()">Arrêter</button></p>`)}
function fqSend(k){const n=S.notifs.find(x=>x.id===FQ[FQI]),e=el(n.eleve),enc=encodeURIComponent(n.msg),t=pnum(e.tel);if(k==='wa')window.open('https://wa.me/'+t+'?text='+enc,'_blank');else if(k==='sms')window.open('sms:'+t+'?body='+enc);else window.open('mailto:'+encodeURIComponent(e.mail)+'?subject='+encodeURIComponent(schName()+' — '+NT[n.type])+'&body='+enc);n.etat='envoyé · '+k;save();setTimeout(fqNext,700)}
function fqNext(){FQI++;fqShow()}

const lnkOk=u=>/^https?:\/\/[^\s]+$/i.test(String(u||'').trim()),

qr=function(txt){return qrSvg(lnk()+'#'+(txt.startsWith('BUS|')?txt.split('|')[2]:txt.split('|')[1]))};
